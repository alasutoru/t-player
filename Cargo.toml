[package]
name = "t-player"
version = "0.1.0"
edition = "2021"

[dependencies]
# 音訊解碼 (純 Rust)
symphonia = { version = "0.5.3", features = ["all"] }
# 音訊輸出
cpal = "0.15.3"
# UI 框架
dioxus = { version = "0.5.4", features = ["desktop"] }
# 非同步與工具
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0.81"
log = "0.4.21"
env_logger = "0.11.3"
futures-util = "0.3"
urlencoding = "2.1"
serde = "1.0.228"
serde_json = "1.0.149"
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["fs", "cors"] }
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
opt-level = "z"      # 針對體積進行優化 (Optimize for size)
lto = true           # 啟用連結時間優化 (Link Time Optimization)
codegen-units = 1    # 降低並行編譯以提升優化效果
panic = "abort"      # 發生 Panic 時直接終止，減少展開代碼體積
strip = true         # 自動移除符號表 (Symbols)
